<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Remote Key Control</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px;">
    <ion-button (click)="scanNetworkAndAutoConnect()" expand="block" color="primary" [disabled]="scanning || connected">
      <ng-container *ngIf="!scanning">Scan Network</ng-container>
      <ng-container *ngIf="scanning">
        Scanning...
        <ion-spinner name="dots" style="margin-left:8px;"></ion-spinner>
      </ng-container>
    </ion-button>

    <ion-button color="danger" (click)="disconnect()" [disabled]="!connected">
      Disconnect
    </ion-button>

    <ion-button color="medium" [routerLink]="['/control']" [disabled]="!connected">
      More Controls
    </ion-button>
  </div>

  <div *ngIf="connected" style="margin-bottom:12px;">
    <strong>Connected:</strong> {{ connectedIp }}
  </div>

  <ion-list *ngIf="foundIps.length > 0">
    <ion-item button *ngFor="let ip of foundIps" (click)="autoConnect(ip)">
      <ion-label>
        {{ ip }} <div slot="end" style="font-size:0.8rem; color:gray;">port {{ 5000 }}</div>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="button-container" *ngIf="connected">
    <ion-button expand="block" size="large" class="big-btn" (click)="sendKey('[')">
      [
    </ion-button>

    <ion-button expand="block" size="large" class="big-btn" (click)="sendKey(']')">
      ]
    </ion-button>
  </div>

</ion-content>
